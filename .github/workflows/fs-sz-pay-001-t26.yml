name: FS-SZ-PAY-001 T26 empty provider response
on:
  push:
    branches: [qualification/fs-sz-pay-001-t26-unsigned-provider-response]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  challenge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: harness
        run: python -m pip install -r requirements.txt
      - name: Run frozen challenge
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          (cd harness && python -m pytest -q tests/test_fs_sz_pay_001_t26_empty_provider_response.py) > evidence/t26.txt 2>&1
          code=$?
          echo "$code" > evidence/t26.exit
          cat evidence/t26.txt
          exit "$code"
      - name: Preserve
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-T26-first-red
          path: evidence/
