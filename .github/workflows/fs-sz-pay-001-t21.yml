name: FS-SZ-PAY-001 T21 bounded intent claim
on:
  push:
    branches: [qualification/fs-sz-pay-001-t21-intent-claim]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: harness
        run: python -m pip install -r requirements.txt
      - name: Qualify bounded claim component independently
        shell: bash
        run: |
          mkdir -p t21-evidence
          (cd harness && python -m pytest -q tests/test_fs_sz_pay_001_t21_intent_claim.py) > t21-evidence/claim-component.txt 2>&1
          code=$?
          echo "$code" > t21-evidence/claim-component.exit
          cat t21-evidence/claim-component.txt
          exit "$code"
      - name: Run and preserve results
        shell: bash
        run: |
          mkdir -p t21-evidence
          git rev-parse HEAD > t21-evidence/commit.txt
          (cd harness && python -m pytest -q) > t21-evidence/pytest.txt 2>&1
          code=$?
          echo "$code" > t21-evidence/exit.txt
          tail -n 100 t21-evidence/pytest.txt
          exit "$code"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-T21-results
          path: t21-evidence/
