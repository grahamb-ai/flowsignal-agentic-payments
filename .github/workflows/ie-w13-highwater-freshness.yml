name: IE-W13 high-water freshness reference
on:
  push:
    branches: [qualification/fs-sz-pay-001-consolidation-candidate]
    paths:
      - 'qualification/pgsodium/ie_w13_highwater_freshness_reference.py'
      - '.github/workflows/ie-w13-highwater-freshness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run local high-water hostile reference
        run: |
          set -euo pipefail
          mkdir -p ie-w13-evidence
          git rev-parse HEAD > ie-w13-evidence/commit.txt
          python qualification/pgsodium/ie_w13_highwater_freshness_reference.py | tee ie-w13-evidence/raw.txt
          grep -q 'IE-W13 LOCAL GREEN' ie-w13-evidence/raw.txt
          grep -q 'IE-W13 PRESERVED RED' ie-w13-evidence/raw.txt
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IE-W13-highwater-reference
          path: ie-w13-evidence/
