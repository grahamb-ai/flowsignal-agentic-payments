name: FS-SZ-PAY-001 T24 provider fence component
on:
  push:
    branches: [qualification/fs-sz-pay-001-t24-provider-fence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: harness
        run: python -m pip install -r requirements.txt
      - name: Qualify provider fence component separately
        shell: bash
        run: |
          mkdir -p t24-evidence
          git rev-parse HEAD > t24-evidence/commit.txt
          (cd harness && python -m pytest -q tests/test_fs_sz_pay_001_t24_provider_fence.py) > t24-evidence/component.txt 2>&1
          code=$?
          echo "$code" > t24-evidence/component.exit
          cat t24-evidence/component.txt
          exit "$code"
      - name: Preserve full-suite RED separately
        if: success()
        shell: bash
        run: |
          (cd harness && python -m pytest -q) > t24-evidence/full-suite.txt 2>&1
          code=$?
          echo "$code" > t24-evidence/full-suite.exit
          tail -n 40 t24-evidence/full-suite.txt
          exit "$code"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-T24-evidence
          path: t24-evidence/
