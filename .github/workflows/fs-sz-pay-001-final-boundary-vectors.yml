name: FS-SZ-PAY-001 final-boundary Ed25519 interoperability vectors
on:
  push:
    branches: [qualification/fs-sz-pay-001-consolidation-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install cryptography
      - name: Generate canonical test-only Ed25519 vectors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-boundary-vectors
          git rev-parse HEAD > final-boundary-vectors/commit.txt
          python harness/tests/fs_sz_pay_001_final_boundary_interop_vectors.py > final-boundary-vectors/vectors.json
          python -m json.tool final-boundary-vectors/vectors.json > /dev/null
          echo 'REFERENCE VECTORS GENERATED — NO DATABASE VERIFIER QUALIFIED' > final-boundary-vectors/disposition.txt
      - name: Preserve canonical bytes and signature
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-final-boundary-interoperability
          path: final-boundary-vectors/
