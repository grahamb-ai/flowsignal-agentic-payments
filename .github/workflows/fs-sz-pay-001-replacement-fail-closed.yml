name: FS-SZ-PAY-001 replacement fail-closed gate
on:
  push:
    branches: [qualification/fs-sz-pay-001-consolidation-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qualification-only
          POSTGRES_DB: qualification
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d qualification"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: qualification-only
      PGDATABASE: qualification
    steps:
      - uses: actions/checkout@v4
      - name: Challenge fail-closed service and provider identities
        shell: bash
        run: |
          mkdir -p fail-closed-evidence
          git rev-parse HEAD > fail-closed-evidence/commit.txt
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_pg_role_isolation.sql > fail-closed-evidence/setup.txt 2>&1
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_disable_unsigned_commit_candidate.sql > fail-closed-evidence/shutdown.txt 2>&1
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_commit_service_identity_candidate.sql > fail-closed-evidence/identity.txt 2>&1
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_replacement_fail_closed_gate.sql > fail-closed-evidence/gate.txt 2>&1
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_replacement_fail_closed_challenge.sql > fail-closed-evidence/challenge.txt 2>&1
          cat fail-closed-evidence/gate.txt fail-closed-evidence/challenge.txt
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-replacement-fail-closed
          path: fail-closed-evidence/
