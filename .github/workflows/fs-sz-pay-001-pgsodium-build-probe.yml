name: FS-SZ-PAY-001 pgsodium PG16 compatibility experiment
on:
  push:
    branches: [qualification/fs-sz-pay-001-consolidation-candidate]
    paths:
      - 'qualification/pgsodium/**'
      - 'qualification/sql/fs_sz_pay_001_authenticated_final_commit_candidate.sql'
      - '.github/workflows/fs-sz-pay-001-pgsodium-build-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated PostgreSQL 16 extension image
        shell: bash
        run: |
          mkdir -p pgsodium-evidence
          python -m compileall -q qualification/pgsodium
          git rev-parse HEAD > pgsodium-evidence/commit.txt
          set +e
          docker build --progress=plain -f qualification/pgsodium/Dockerfile -t fs-pgsodium-evaluation:local . > pgsodium-evidence/build.txt 2>&1
          result=$?
          set -e
          echo "$result" > pgsodium-evidence/build-exit.txt
          if [ "$result" -ne 0 ]; then
            echo 'BUILD RED: extension compatibility NOT qualified' > pgsodium-evidence/disposition.txt
            exit "$result"
          fi
          docker run -d --name fs-pgsodium-qualification -e POSTGRES_PASSWORD=qualification-only -p 55432:5432 fs-pgsodium-evaluation:local > pgsodium-evidence/container-id.txt
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec fs-pgsodium-qualification pg_isready -U postgres >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs fs-pgsodium-qualification > pgsodium-evidence/container-logs.txt 2>&1 || true
            echo 'RED: extension container did not become ready' > pgsodium-evidence/disposition.txt
            exit 1
          fi
          docker exec fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE EXTENSION pgsodium" > pgsodium-evidence/install.txt 2>&1
          docker exec -i fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -f /dev/stdin < qualification/sql/fs_sz_pay_001_pgsodium_capability_gate.sql > pgsodium-evidence/capability.txt 2>&1
          grep -q 'PGSODIUM FUNCTION FOUND' pgsodium-evidence/capability.txt
          python -m pip install cryptography > pgsodium-evidence/python-deps.txt 2>&1
          python qualification/pgsodium/generate_interop_sql.py > pgsodium-evidence/interop.sql
          docker exec -i fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -f /dev/stdin < pgsodium-evidence/interop.sql > pgsodium-evidence/interop.txt 2>&1
          cat pgsodium-evidence/interop.txt
          python qualification/pgsodium/generate_unbound_fields_negative_sql.py > pgsodium-evidence/unbound-fields-negative.sql
          docker exec -i fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -f /dev/stdin < pgsodium-evidence/unbound-fields-negative.sql > pgsodium-evidence/unbound-fields-negative.txt 2>&1
          cat pgsodium-evidence/unbound-fields-negative.txt
          python qualification/pgsodium/generate_bound_fields_sql.py > pgsodium-evidence/bound-fields.sql
          docker exec -i fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -f /dev/stdin < pgsodium-evidence/bound-fields.sql > pgsodium-evidence/bound-fields.txt 2>&1
          cat pgsodium-evidence/bound-fields.txt
          for sql in qualification/sql/fs_sz_pay_001_pg_role_isolation.sql qualification/sql/fs_sz_pay_001_disable_unsigned_commit_candidate.sql qualification/sql/fs_sz_pay_001_commit_service_identity_candidate.sql qualification/sql/fs_sz_pay_001_institutional_trust_store_candidate.sql qualification/sql/fs_sz_pay_001_authenticated_final_commit_candidate.sql; do
            docker exec -i fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -f /dev/stdin < "$sql" >> pgsodium-evidence/atomic-setup.txt 2>&1
          done
          python qualification/pgsodium/generate_atomic_commit_sql.py > pgsodium-evidence/atomic-commit.sql
          docker exec -i fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -f /dev/stdin < pgsodium-evidence/atomic-commit.sql > pgsodium-evidence/atomic-commit.txt 2>&1
          cat pgsodium-evidence/atomic-commit.txt
          docker exec fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE fs_commit_service LOGIN PASSWORD 'qualification-only-service'" > pgsodium-evidence/login-setup.txt 2>&1
          python qualification/pgsodium/generate_stolen_credential_signed_boundary_sql.py > pgsodium-evidence/stolen-login.sql
          docker exec -i -e PGPASSWORD=qualification-only-service fs-pgsodium-qualification psql -h 127.0.0.1 -U fs_commit_service -d postgres -v ON_ERROR_STOP=1 -f /dev/stdin < pgsodium-evidence/stolen-login.sql > pgsodium-evidence/stolen-login.txt 2>&1
          cat pgsodium-evidence/stolen-login.txt
          grep -q 'REFUSED_INVALID_BINDING' pgsodium-evidence/stolen-login.txt
          grep -A 3 'unsigned_durable_commit_count' pgsodium-evidence/stolen-login.txt | grep -q '0'
          grep -A 3 'old_unsigned_function_executable' pgsodium-evidence/stolen-login.txt | grep -q 'f'
          python qualification/pgsodium/generate_real_login_hostile_sql.py > pgsodium-evidence/real-login-hostile.sql
          docker exec -i -e PGPASSWORD=qualification-only-service fs-pgsodium-qualification psql -h 127.0.0.1 -U fs_commit_service -d postgres -v ON_ERROR_STOP=1 -f /dev/stdin < pgsodium-evidence/real-login-hostile.sql > pgsodium-evidence/real-login-hostile.txt 2>&1
          cat pgsodium-evidence/real-login-hostile.txt
          docker exec fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -c "UPDATE fs_provider.mandates SET revoked=true WHERE id='MANDATE-VECTOR'" > pgsodium-evidence/revocation-state.txt 2>&1
          python qualification/pgsodium/generate_revocation_final_sql.py revoked > pgsodium-evidence/revoked.sql
          docker exec -i -e PGPASSWORD=qualification-only-service fs-pgsodium-qualification psql -h 127.0.0.1 -U fs_commit_service -d postgres -v ON_ERROR_STOP=1 -f /dev/stdin < pgsodium-evidence/revoked.sql > pgsodium-evidence/revoked.txt 2>&1
          docker exec fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -c "UPDATE fs_provider.mandates SET revoked=false,epoch=8 WHERE id='MANDATE-VECTOR'" > pgsodium-evidence/epoch-state.txt 2>&1
          python qualification/pgsodium/generate_revocation_final_sql.py stale > pgsodium-evidence/stale-epoch.sql
          docker exec -i -e PGPASSWORD=qualification-only-service fs-pgsodium-qualification psql -h 127.0.0.1 -U fs_commit_service -d postgres -v ON_ERROR_STOP=1 -f /dev/stdin < pgsodium-evidence/stale-epoch.sql > pgsodium-evidence/stale-epoch.txt 2>&1
          cat pgsodium-evidence/revoked.txt pgsodium-evidence/stale-epoch.txt
          python -m pip install psycopg2-binary > pgsodium-evidence/pg-driver.txt 2>&1
          python qualification/pgsodium/signed_commit_revocation_race.py > pgsodium-evidence/signed-race.txt 2>&1
          cat pgsodium-evidence/signed-race.txt
          python qualification/pgsodium/signed_commit_lost_ack_retry.py > pgsodium-evidence/signed-lost-ack-retry.txt 2>&1
          cat pgsodium-evidence/signed-lost-ack-retry.txt
          python qualification/pgsodium/signed_commit_reconcile_after_retry.py > pgsodium-evidence/signed-reconciliation.txt 2>&1
          cat pgsodium-evidence/signed-reconciliation.txt
          # Restart the isolated database after the signed transaction has committed.
          # This tests durability across a controlled restart, NOT a power-loss crash.
          docker restart fs-pgsodium-qualification > pgsodium-evidence/restart.txt 2>&1
          ready_after_restart=0
          for attempt in $(seq 1 30); do
            if docker exec fs-pgsodium-qualification pg_isready -U postgres >/dev/null 2>&1; then ready_after_restart=1; break; fi
            sleep 2
          done
          test "$ready_after_restart" -eq 1
          python qualification/pgsodium/signed_commit_reconcile_after_retry.py > pgsodium-evidence/post-restart-reconciliation.txt 2>&1
          cat pgsodium-evidence/post-restart-reconciliation.txt
          # Abruptly terminate the database container after a durable commit,
          # then restart and reconcile from a separate process.
          docker kill --signal=SIGKILL fs-pgsodium-qualification > pgsodium-evidence/abrupt-kill.txt 2>&1
          docker start fs-pgsodium-qualification > pgsodium-evidence/abrupt-restart.txt 2>&1
          ready_after_kill=0
          for attempt in $(seq 1 45); do
            if docker exec fs-pgsodium-qualification pg_isready -U postgres >/dev/null 2>&1; then ready_after_kill=1; break; fi
            sleep 2
          done
          test "$ready_after_kill" -eq 1
          python qualification/pgsodium/signed_commit_reconcile_after_retry.py > pgsodium-evidence/post-sigkill-reconciliation.txt 2>&1
          cat pgsodium-evidence/post-sigkill-reconciliation.txt
          python qualification/pgsodium/signed_commit_inflight_backend_kill.py > pgsodium-evidence/inflight-backend-kill.txt 2>&1
          cat pgsodium-evidence/inflight-backend-kill.txt
          python qualification/pgsodium/signed_commit_noncanonical_wire_probe.py > pgsodium-evidence/noncanonical-wire.txt 2>&1
          cat pgsodium-evidence/noncanonical-wire.txt
          docker exec -i -e PGPASSWORD=qualification-only-service fs-pgsodium-qualification psql -h 127.0.0.1 -U fs_commit_service -d postgres -v ON_ERROR_STOP=1 -f /dev/stdin < qualification/sql/fs_sz_pay_001_real_login_privilege_gate.sql > pgsodium-evidence/real-login-privileges.txt 2>&1
          cat pgsodium-evidence/real-login-privileges.txt
          set +e
          docker exec -i -e PGPASSWORD=qualification-only-service fs-pgsodium-qualification psql -h 127.0.0.1 -U fs_commit_service -d postgres -v ON_ERROR_STOP=1 -f /dev/stdin < qualification/sql/fs_sz_pay_001_real_login_direct_insert_attack.sql > pgsodium-evidence/direct-insert-attack.txt 2>&1
          attack_exit=$?
          set -e
          echo "$attack_exit" > pgsodium-evidence/direct-insert-exit.txt
          test "$attack_exit" -ne 0
          grep -q 'permission denied' pgsodium-evidence/direct-insert-attack.txt
          docker exec fs-pgsodium-qualification psql -U postgres -At -c "SELECT count(*) FROM fs_provider.commits WHERE intent_id='PRIVILEGE-DIRECT-BYPASS-001'" > pgsodium-evidence/direct-insert-durable-count.txt
          grep -qx '0' pgsodium-evidence/direct-insert-durable-count.txt
          docker exec -i fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -f /dev/stdin < qualification/sql/fs_sz_pay_001_privileged_route_inventory.sql > pgsodium-evidence/privileged-route-inventory.txt 2>&1
          cat pgsodium-evidence/privileged-route-inventory.txt
          docker exec -i fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -f /dev/stdin < qualification/sql/fs_sz_pay_001_privileged_owner_bypass_characterisation.sql > pgsodium-evidence/privileged-owner-bypass.txt 2>&1
          cat pgsodium-evidence/privileged-owner-bypass.txt
          grep -A 3 'privileged_bypass_durable_count' pgsodium-evidence/privileged-owner-bypass.txt | grep -q '1'
          set +e
          docker exec -i fs-pgsodium-qualification psql -U postgres -v ON_ERROR_STOP=1 -f /dev/stdin < qualification/sql/fs_sz_pay_001_privileged_deployment_negative_guard.sql > pgsodium-evidence/privileged-deployment-guard.txt 2>&1
          guard_exit=$?
          set -e
          echo "$guard_exit" > pgsodium-evidence/privileged-deployment-guard-exit.txt
          test "$guard_exit" -ne 0
          grep -q 'PRIVILEGED_ROUTE_REFUSE' pgsodium-evidence/privileged-deployment-guard.txt
          python qualification/pgsodium/independent_receipt_crypto_reference.py > pgsodium-evidence/independent-receipt-reference.txt 2>&1
          cat pgsodium-evidence/independent-receipt-reference.txt
          python qualification/pgsodium/independent_receipt_audit_chain_reference.py > pgsodium-evidence/independent-audit-chain-reference.txt 2>&1
          cat pgsodium-evidence/independent-audit-chain-reference.txt
          python qualification/pgsodium/independent_signed_checkpoint_reference.py > pgsodium-evidence/signed-checkpoint-reference.txt 2>&1
          cat pgsodium-evidence/signed-checkpoint-reference.txt
          python qualification/pgsodium/signed_checkpoint_rollback_reference.py > pgsodium-evidence/signed-checkpoint-rollback.txt 2>&1
          cat pgsodium-evidence/signed-checkpoint-rollback.txt
          python qualification/pgsodium/durable_witness_restart_reference.py > pgsodium-evidence/durable-witness-restart.txt 2>&1
          cat pgsodium-evidence/durable-witness-restart.txt
          python qualification/pgsodium/witness_cas_concurrency_reference.py > pgsodium-evidence/witness-cas-concurrency.txt 2>&1
          cat pgsodium-evidence/witness-cas-concurrency.txt
          echo 'PRESERVED PRIVILEGED-OWNER, AUTHENTIC-ANCHOR ROLLBACK AND WITNESS-STORE COMPROMISE REDS; IE-W04 CAS LOCAL REFERENCE ONLY; independent execution/storage/keys NOT QUALIFIED' > pgsodium-evidence/disposition.txt
      - name: Preserve raw experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-pgsodium-build-probe
          path: pgsodium-evidence/
