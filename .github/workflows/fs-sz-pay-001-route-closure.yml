name: FS-SZ-PAY-001 atomic fenced direct route
on:
  push:
    branches: [qualification/fs-sz-pay-001-route-closure-atomic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: harness
        run: python -m pip install -r requirements.txt
      - name: Execute frozen route-closure challenge
        shell: bash
        run: |
          mkdir -p closure-evidence
          git rev-parse HEAD > closure-evidence/commit.txt
          (cd harness && python -m pytest -q tests/test_fs_sz_pay_001_route_closure_direct.py) > closure-evidence/route-closure.txt 2>&1
          code=$?
          echo "$code" > closure-evidence/exit.txt
          cat closure-evidence/route-closure.txt
          exit "$code"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-route-closure-atomic
          path: closure-evidence/
