name: FS-SZ-PAY-001 integrated commitment qualification
on:
  push:
    branches: [qualification/fs-sz-pay-001-integrated-commitment]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: harness
        run: python -m pip install -r requirements.txt
      - name: Run bounded integrated and provider fence tests
        shell: bash
        run: |
          mkdir -p qualification-evidence
          git rev-parse HEAD > qualification-evidence/commit.txt
          (cd harness && python -m pytest -q tests/test_fs_sz_pay_001_integrated_commitment.py tests/test_fs_sz_pay_001_t24_provider_fence.py) > qualification-evidence/integrated.txt 2>&1
          code=$?
          echo "$code" > qualification-evidence/integrated.exit
          cat qualification-evidence/integrated.txt
          exit "$code"
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-integrated-commitment
          path: qualification-evidence/
