name: IE-W12 signed witness receipt reference
on:
  push:
    branches: [qualification/fs-sz-pay-001-consolidation-candidate]
    paths:
      - 'qualification/pgsodium/ie_w12_signed_witness_receipt_reference.py'
      - '.github/workflows/ie-w12-signed-witness-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test-only crypto dependency
        run: python -m pip install 'cryptography>=43'
      - name: Run receipt hostile reference
        run: |
          mkdir -p ie-w12-evidence
          git rev-parse HEAD > ie-w12-evidence/commit.txt
          python qualification/pgsodium/ie_w12_signed_witness_receipt_reference.py | tee ie-w12-evidence/raw.txt
          grep -q 'IE-W12 LOCAL GREEN' ie-w12-evidence/raw.txt
          grep -q 'IE-W12 PRESERVED RED' ie-w12-evidence/raw.txt
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IE-W12-signed-witness-receipt
          path: ie-w12-evidence/
