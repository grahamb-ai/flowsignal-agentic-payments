name: FS-SZ-PAY-001 provider authentication gate
on:
  push:
    branches: [qualification/fs-sz-pay-001-consolidation-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run unchanged hostile challenge and positive signed instruction
        shell: bash
        run: |
          mkdir -p auth-evidence
          git rev-parse HEAD > auth-evidence/commit.txt
          (cd harness && python -m pytest -q tests/test_fs_sz_pay_001_provider_authentication.py) > auth-evidence/pytest.txt 2>&1
          result=$?
          echo "$result" > auth-evidence/exit.txt
          cat auth-evidence/pytest.txt
          exit "$result"
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-provider-authentication
          path: auth-evidence/
