name: MRQ-001 Master Runtime Qualification Regression

on:
  workflow_dispatch:

jobs:
  regression:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: AT-004 historical commit (documented 60; current collection 17)
            ref: d9dab01eb1cc6d8a0c7fb50eadbdb1560a7d6ce1
          - label: EC-001 bounded regression baseline (30 tests)
            ref: b154b82bd429d1d1f2a1e63306099de3e18423ff
          - label: Qualified MVP baseline (42 tests)
            ref: 8ac87bfce7110fdd9aa5d22a3f1df5622fbb679d

    steps:
      - name: Check out exact evidence baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: harness
        run: pip install -r requirements.txt

      - name: Run regression suite
        working-directory: harness
        run: pytest -q
