name: EC-001 and Regression Tests

on:
  push:
    branches:
      - ec-001-independent-execution-authority
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: harness
        run: pip install -r requirements.txt

      - name: Run full harness test suite
        working-directory: harness
        run: pytest -q
