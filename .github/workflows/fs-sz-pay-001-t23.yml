name: FS-SZ-PAY-001 T23 provider commitment challenge
on:
  push:
    branches: [qualification/fs-sz-pay-001-t23-commitment-fence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: harness
        run: python -m pip install -r requirements.txt
      - name: Run frozen suite and T23 challenge
        shell: bash
        run: |
          mkdir -p t23-evidence
          git rev-parse HEAD > t23-evidence/commit.txt
          (cd harness && python -m pytest -q) > t23-evidence/pytest.txt 2>&1
          code=$?
          echo "$code" > t23-evidence/exit.txt
          tail -n 90 t23-evidence/pytest.txt
          exit "$code"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-T23-first-run
          path: t23-evidence/
