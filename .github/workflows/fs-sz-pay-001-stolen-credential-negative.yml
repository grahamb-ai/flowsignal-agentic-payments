name: FS-SZ-PAY-001 stolen commitment credential negative control
on:
  push:
    branches: [qualification/fs-sz-pay-001-consolidation-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stolen-service-credential:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qualification-only
          POSTGRES_DB: qualification
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d qualification"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: qualification-only
      PGDATABASE: qualification
      FS_QUAL_ADMIN_DSN: postgresql://postgres:qualification-only@localhost:5432/qualification
      FS_QUAL_COMMIT_SERVICE_DSN: postgresql://fs_commit_service:reference-only@localhost:5432/qualification
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install psycopg[binary]
      - name: Hostile actual-login unsigned commitment probe
        shell: bash
        run: |
          mkdir -p stolen-credential-evidence
          git rev-parse HEAD > stolen-credential-evidence/commit.txt
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_pg_role_isolation.sql > stolen-credential-evidence/setup.txt 2>&1
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_disable_unsigned_commit_candidate.sql >> stolen-credential-evidence/setup.txt 2>&1
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_commit_service_identity_candidate.sql >> stolen-credential-evidence/setup.txt 2>&1
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE fs_commit_service LOGIN PASSWORD 'reference-only'" >> stolen-credential-evidence/setup.txt 2>&1
          set +e
          python harness/tests/fs_sz_pay_001_stolen_commit_credential_negative.py > stolen-credential-evidence/raw.txt 2>&1
          code=$?
          set -e
          cat stolen-credential-evidence/raw.txt
          echo "$code" > stolen-credential-evidence/exit.txt
          exit "$code"
      - name: Archive raw evidence even on RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-stolen-credential-negative
          path: stolen-credential-evidence/
