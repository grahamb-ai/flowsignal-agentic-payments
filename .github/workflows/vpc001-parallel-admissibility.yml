        working-directory: harness
        run: pip install -r requirements.txt
      - name: Run FlowSignal VPC-001.3
        working-directory: harness
        run: pytest -q tests/test_vpc001_3_cross_department_collision.py

  elyria-vpc001-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
