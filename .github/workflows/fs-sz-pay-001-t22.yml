name: FS-SZ-PAY-001 T22 atomic claim reference
on:
  push:
    branches: [qualification/fs-sz-pay-001-t22-atomic-claim]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: harness
        run: python -m pip install -r requirements.txt
      - name: Run bounded atomic-claim qualification
        shell: bash
        run: |
          mkdir -p t22-evidence
          (cd harness && python -m pytest -q tests/test_fs_sz_pay_001_t22_atomic_claim.py) > t22-evidence/component.txt 2>&1
          code=$?
          echo "$code" > t22-evidence/component.exit
          cat t22-evidence/component.txt
          exit "$code"
      - name: Run full suite and preserve unresolved T20
        if: success()
        shell: bash
        run: |
          (cd harness && python -m pytest -q) > t22-evidence/full.txt 2>&1
          code=$?
          echo "$code" > t22-evidence/full.exit
          tail -n 45 t22-evidence/full.txt
          exit "$code"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-T22-evidence
          path: t22-evidence/
