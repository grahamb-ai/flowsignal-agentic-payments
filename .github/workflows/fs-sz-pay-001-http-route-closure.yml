name: FS-SZ-PAY-001 HTTP provider route closure
on:
  push:
    branches: [qualification/fs-sz-pay-001-http-route-closure]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: harness
        run: python -m pip install -r requirements.txt
      - name: HTTP route closure and prior focused tests
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          (cd harness && python -m pytest -q tests/test_fs_sz_pay_001_http_route_closure.py tests/test_fs_sz_pay_001_route_closure_direct.py) > evidence/pytest.txt 2>&1
          code=$?
          echo "$code" > evidence/exit.txt
          cat evidence/pytest.txt
          exit "$code"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-HTTP-route-closure
          path: evidence/
