name: FS-COLLAB-001 Independent External Non-Formation

on:
  pull_request:
    paths:
      - 'evidence/FS-COLLAB-001/**'
      - 'harness/tests/test_fs_collab_001_independent_nonformation.py'
      - 'harness/external_targets/cbp002_consequence_service.py'
      - 'harness/app/engines/external_consequence_adapter.py'
      - 'harness/app/engines/protected_consequence.py'
      - 'harness/app/engines/execution_gateway.py'
      - 'harness/app/engines/authority_store.py'
      - 'harness/app/engines/consequence_receipt.py'
      - '.github/workflows/fs-collab-001-independent-nonformation.yml'
  workflow_dispatch:

jobs:
  independent-nonformation:
    name: Frozen independent non-formation proposition
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install harness requirements
        run: pip install -r requirements.txt

      - name: Run frozen FS-COLLAB-001 challenge
        run: pytest -q tests/test_fs_collab_001_independent_nonformation.py
