name: FS-SZ-PAY-001 T20 unresolved retry challenge
on:
  push:
    branches: [qualification/fs-sz-pay-001-t20-reconciliation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  challenge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        working-directory: harness
        run: python -m pip install -r requirements.txt
      - name: Run and preserve original result
        shell: bash
        run: |
          mkdir -p t20-evidence
          git rev-parse HEAD > t20-evidence/commit.txt
          (cd harness && python -m pytest -q) > t20-evidence/pytest.txt 2>&1
          code=$?
          echo "$code" > t20-evidence/exit.txt
          tail -n 80 t20-evidence/pytest.txt
          exit "$code"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-T20-first-run
          path: t20-evidence/
