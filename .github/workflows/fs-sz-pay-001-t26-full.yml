name: FS-SZ-PAY-001 T26 full regression
on:
  push:
    branches: [qualification/fs-sz-pay-001-t26-unsigned-provider-response]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: harness
        run: python -m pip install -r requirements.txt
      - name: Run T26 targeted
        shell: bash
        run: |
          mkdir -p t26-evidence
          (cd harness && python -m pytest -q tests/test_fs_sz_pay_001_t26_empty_provider_response.py) > t26-evidence/targeted.txt 2>&1
          code=$?
          echo "$code" > t26-evidence/targeted.exit
          cat t26-evidence/targeted.txt
          exit "$code"
      - name: Run full regression including preserved T23 RED
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > t26-evidence/commit.txt
          (cd harness && python -m pytest -q) > t26-evidence/full-suite.txt 2>&1
          code=$?
          echo "$code" > t26-evidence/full-suite.exit
          tail -n 70 t26-evidence/full-suite.txt
          exit "$code"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-T26-candidate-evidence
          path: t26-evidence/
