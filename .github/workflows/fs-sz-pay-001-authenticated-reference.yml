name: FS-SZ-PAY-001 authenticated replacement reference
on:
  push:
    branches: [qualification/fs-sz-pay-001-consolidation-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-reference:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qualification-only
          POSTGRES_DB: qualification
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d qualification"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: qualification-only
      PGDATABASE: qualification
      FS_QUAL_ADMIN_DSN: postgresql://postgres:qualification-only@localhost:5432/qualification
      FS_QUAL_COMMIT_SERVICE_DSN: postgresql://fs_commit_service:reference-only@localhost:5432/qualification
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install psycopg[binary] cryptography
      - name: Exercise real signed replacement reference
        shell: bash
        run: |
          mkdir -p authenticated-reference-evidence
          git rev-parse HEAD > authenticated-reference-evidence/commit.txt
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_pg_role_isolation.sql > authenticated-reference-evidence/setup.txt 2>&1
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_disable_unsigned_commit_candidate.sql >> authenticated-reference-evidence/setup.txt 2>&1
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_commit_service_identity_candidate.sql >> authenticated-reference-evidence/setup.txt 2>&1
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE fs_commit_service LOGIN PASSWORD 'reference-only'" >> authenticated-reference-evidence/setup.txt 2>&1
          set +e
          python harness/tests/fs_sz_pay_001_authenticated_commit_reference_integration.py > authenticated-reference-evidence/test.txt 2>&1
          code=$?
          set -e
          cat authenticated-reference-evidence/test.txt
          echo "$code" > authenticated-reference-evidence/exit.txt
          exit "$code"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-authenticated-reference
          path: authenticated-reference-evidence/
