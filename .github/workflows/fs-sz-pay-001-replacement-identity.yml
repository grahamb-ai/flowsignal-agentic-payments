name: FS-SZ-PAY-001 replacement identity qualification
on:
  push:
    branches: [qualification/fs-sz-pay-001-consolidation-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replacement-identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qualification-only
          POSTGRES_DB: qualification
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d qualification"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: qualification-only
      PGDATABASE: qualification
    steps:
      - uses: actions/checkout@v4
      - name: Run replacement identity topology and preserve RED
        shell: bash
        run: |
          mkdir -p replacement-identity-evidence
          git rev-parse HEAD > replacement-identity-evidence/commit.txt
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_pg_role_isolation.sql > replacement-identity-evidence/setup.txt 2>&1
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_disable_unsigned_commit_candidate.sql > replacement-identity-evidence/shutdown.txt 2>&1
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_commit_service_identity_candidate.sql > replacement-identity-evidence/identity.txt 2>&1
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_commit_service_identity_challenge.sql > replacement-identity-evidence/challenge.txt 2>&1
          cat replacement-identity-evidence/challenge.txt
          if grep -A 3 'service_unsigned_result' replacement-identity-evidence/challenge.txt | grep -q 'COMMITTED'; then
            echo 'RED: service credential alone still commits unsigned instruction' | tee replacement-identity-evidence/disposition.txt
            exit 1
          fi
          echo 'Inspect raw evidence: no unsigned service commitment detected' | tee replacement-identity-evidence/disposition.txt
      - name: Preserve evidence regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-replacement-identity
          path: replacement-identity-evidence/
