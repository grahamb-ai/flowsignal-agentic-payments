name: FS-SZ-PAY-001 consolidated candidate regression
on:
  push:
    branches: [qualification/fs-sz-pay-001-consolidation-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r harness/requirements.txt
      - name: Focused consolidated qualification
        shell: bash
        run: |
          mkdir -p consolidation-evidence
          git rev-parse HEAD > consolidation-evidence/commit.txt
          (cd harness && python -m pytest -q tests/test_fs_sz_pay_001_t22_atomic_claim.py tests/test_fs_sz_pay_001_consolidated_intent_replay.py tests/test_fs_sz_pay_001_signed_adapter_provider.py tests/test_fs_sz_pay_001_restart_reconciliation.py tests/test_fs_sz_pay_001_authenticated_reconciliation.py tests/test_fs_sz_pay_001_authority_updater.py tests/test_fs_sz_pay_001_reconciliation.py tests/test_fs_sz_pay_001_provider_authentication.py tests/test_fs_sz_pay_001_consolidated_contract.py tests/test_fs_sz_pay_001_t26_empty_provider_response.py tests/test_fs_sz_pay_001_integrated_commitment.py tests/test_fs_sz_pay_001_integrated_concurrent_race.py tests/test_fs_sz_pay_001_http_route_closure.py tests/test_fs_sz_pay_001_http_mandate_binding.py tests/test_fs_sz_pay_001_mandate_epoch_controls.py tests/test_fs_sz_pay_001_mandate_required.py) > consolidation-evidence/focused.txt 2>&1
          code=$?
          echo "$code" > consolidation-evidence/focused.exit
          cat consolidation-evidence/focused.txt
          exit "$code"
      - name: Full regression with preserved historical RED
        if: always()
        shell: bash
        run: |
          (cd harness && python -m pytest -q tests) > consolidation-evidence/full.txt 2>&1
          code=$?
          echo "$code" > consolidation-evidence/full.exit
          tail -n 70 consolidation-evidence/full.txt
          exit 0
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-consolidated-candidate
          path: consolidation-evidence/
