name: FS-SZ-PAY-001 PostgreSQL authority isolation
on:
  push:
    branches: [qualification/fs-sz-pay-001-consolidation-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qualification-only
          POSTGRES_DB: qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qualification"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: qualification-only
      PGDATABASE: qualification
    steps:
      - uses: actions/checkout@v4
      - name: Execute database-level AUTH-01..04 challenge
        shell: bash
        run: |
          mkdir -p auth-db-evidence
          git rev-parse HEAD > auth-db-evidence/commit.txt
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_pg_role_isolation.sql > auth-db-evidence/setup.txt 2>&1
          setup=$?
          if [ "$setup" -ne 0 ]; then cat auth-db-evidence/setup.txt; exit "$setup"; fi
          psql -v ON_ERROR_STOP=1 -f qualification/sql/fs_sz_pay_001_pg_role_challenge.sql > auth-db-evidence/challenge.txt 2>&1
          result=$?
          cat auth-db-evidence/challenge.txt
          echo "$result" > auth-db-evidence/exit.txt
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          bash qualification/sql/fs_sz_pay_001_pg_revocation_race.sh > auth-db-evidence/revocation-race.txt 2>&1
          race=$?
          cat auth-db-evidence/revocation-race.txt
          echo "$race" > auth-db-evidence/race-exit.txt
          if [ "$race" -ne 0 ]; then exit "$race"; fi
          bash qualification/sql/fs_sz_pay_001_pg_commit_first_race.sh > auth-db-evidence/commit-first-race.txt 2>&1
          reverse=$?
          cat auth-db-evidence/commit-first-race.txt
          echo "$reverse" > auth-db-evidence/reverse-exit.txt
          if [ "$reverse" -ne 0 ]; then exit "$reverse"; fi
          bash qualification/sql/fs_sz_pay_001_pg_session_restart_retry.sh > auth-db-evidence/session-restart-retry.txt 2>&1
          restart=$?
          cat auth-db-evidence/session-restart-retry.txt
          echo "$restart" > auth-db-evidence/restart-exit.txt
          if [ "$restart" -ne 0 ]; then exit "$restart"; fi
          bash qualification/sql/fs_sz_pay_001_pg_server_restart.sh > auth-db-evidence/server-restart.txt 2>&1
          server_restart=$?
          cat auth-db-evidence/server-restart.txt
          echo "$server_restart" > auth-db-evidence/server-restart-exit.txt
          if [ "$server_restart" -ne 0 ]; then exit "$server_restart"; fi
          bash qualification/sql/fs_sz_pay_001_pg_forced_crash_uncommitted.sh > auth-db-evidence/forced-crash-uncommitted.txt 2>&1
          crash=$?
          cat auth-db-evidence/forced-crash-uncommitted.txt
          echo "$crash" > auth-db-evidence/forced-crash-exit.txt
          if [ "$crash" -ne 0 ]; then exit "$crash"; fi
          bash qualification/sql/fs_sz_pay_001_pg_forced_crash_postcommit.sh > auth-db-evidence/forced-crash-postcommit.txt 2>&1
          postcommit=$?
          cat auth-db-evidence/forced-crash-postcommit.txt
          echo "$postcommit" > auth-db-evidence/postcommit-exit.txt
          if [ "$postcommit" -ne 0 ]; then exit "$postcommit"; fi
          python -m pip install "psycopg[binary]>=3.2" "cryptography>=43" "pytest>=8" > auth-db-evidence/integration-deps.txt 2>&1
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE fs_payment_executor LOGIN PASSWORD 'ci-executor-only'; ALTER ROLE fs_authority_writer LOGIN PASSWORD 'ci-writer-only';" > auth-db-evidence/integration-roles.txt 2>&1
          psql -v ON_ERROR_STOP=1 -c "SET ROLE fs_authority_writer; INSERT INTO fs_provider.mandates(id,epoch,revoked) VALUES ('MANDATE-INTEGRATED',1,false);" >> auth-db-evidence/integration-roles.txt 2>&1
          export FS_QUAL_EXECUTOR_DSN="host=localhost port=5432 dbname=qualification user=fs_payment_executor password=ci-executor-only"
          export FS_QUAL_WRITER_DSN="host=localhost port=5432 dbname=qualification user=fs_authority_writer password=ci-writer-only"
          (cd harness && python -m tests.fs_sz_pay_001_pg_integrated_qualification) > auth-db-evidence/integrated-provider.txt 2>&1
          integrated=$?
          cat auth-db-evidence/integrated-provider.txt
          echo "$integrated" > auth-db-evidence/integrated-exit.txt
          if [ "$integrated" -ne 0 ]; then exit "$integrated"; fi
          psql -v ON_ERROR_STOP=1 -c "SET ROLE fs_authority_writer; INSERT INTO fs_provider.mandates(id,epoch,revoked) VALUES ('MANDATE-AP-001',1,false);" >> auth-db-evidence/integration-roles.txt 2>&1
          (cd harness && python -m pytest -q tests/test_fs_sz_pay_001_gateway_postgres_integration.py) > auth-db-evidence/gateway-postgres.txt 2>&1
          gateway=$?
          cat auth-db-evidence/gateway-postgres.txt
          echo "$gateway" > auth-db-evidence/gateway-exit.txt
          exit "$gateway"
      - name: Preserve authority isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FS-SZ-PAY-001-pg-authority-isolation
          path: auth-db-evidence/
